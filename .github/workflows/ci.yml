name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only token: this workflow only builds and tests.
permissions:
  contents: read

# A new push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: ControlService.slnx

defaults:
  run:
    working-directory: backend/ControlService

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      # Warnings are errors in every project (Directory.Build.props, ADR-0026).
      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test --solution ${{ env.SOLUTION }}
          --configuration Release --no-build
          --results-directory ${{ github.workspace }}/test-results
          --coverage --coverage-output-format cobertura
          --report-xunit-trx

      - name: Upload test results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ github.workspace }}/test-results
          if-no-files-found: warn
          retention-days: 14

  docker-image:
    name: Build API image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Validates the Dockerfile only; publishing the image is part of the delivery pipeline (ADR-0029).
      - name: Build image
        run: docker build --file src/ControlService.API/Dockerfile --tag controlservice-api:ci .
